server {
    listen 80;
    server_name game.kvantastica.ru;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name game.kvantastica.ru;

    # SSL — замени пути на свои сертификаты (например, от Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/game.kvantastica.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.kvantastica.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Корень статики — путь к папке с игрой на сервере
    root /var/www/game.kvantastica.ru;
    index index.html;

    # Кэш для GLB-моделей и текстур (большие файлы, меняются редко)
    location ~* \.(glb|gltf|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Кэш для JS/CSS
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Основной маршрут — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Логи
    access_log /var/log/nginx/game.kvantastica.ru.access.log;
    error_log  /var/log/nginx/game.kvantastica.ru.error.log;

    # Gzip для текстовых ресурсов
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
